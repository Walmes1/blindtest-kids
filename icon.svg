      <stop offset="0" stop-color="#2a1d6b"/><stop offset="1" stop-color="#5b1ea8"/>
    </linearGradient>
    <radialGradient id="rb" cx="40%" cy="34%" r="72%">
      <stop offset="0" stop-color="#ff8a8a"/><stop offset="55%" stop-color="#ef4444"/><stop offset="100%" stop-color="#a51010"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>
